; Jalankan: php -S 127.0.0.1:8000 -t public -c php.upload.ini
; Berkas ini menggantikan php.ini, jadi ekstensi database harus ditulis ulang.
; Tanpa -c, batas bawaan 2M/8M menolak paket aset sebelum masuk controller.
upload_max_filesize = 200M
post_max_size = 210M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
extension=pdo_pgsql