name: Deploy IndoFX to Azure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indofx-azure-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, curl
          tools: composer

      - name: Validate PHP and Composer
        run: |
          composer validate --no-check-publish
          find app public routes resources/views -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Package application
        run: sh deploy/package.sh /tmp/indofx-azure.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ZIP
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --src-path /tmp/indofx-azure.zip --type zip --clean false
